  <body class="site--formal page--contact">
    <a class="skip-link" href="#main-content">本文へ移動</a>

    <header class="site-header site-header--formal">
      <div class="page-shell site-header__inner">
        <a class="site-brand" href="/" aria-label="Bashiiin! coffee TOPへ">
          <img src="/images/web/logo-header.png" alt="Bashiiin! coffee" width="400" height="104">
        </a>
        <nav class="desktop-nav" aria-label="メインナビゲーション">
          <a href="/">TOP</a>
          <a href="/about/">ABOUT</a>
          <a href="/coffee/">COFFEE</a>
          <a href="/contact/" aria-current="page">CONTACT</a>
          <a href="/access/">ACCESS</a>
        </nav>
        <div class="header-actions">
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" hidden>
            <span class="sr-only">メニューを開く</span><span class="menu-toggle__icon" aria-hidden="true"><svg class="icon icon--menu" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg><svg class="icon icon--close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>
          </button>
        </div>
      </div>
      <!-- Navigation stays available until its own JavaScript initialization succeeds. -->
      <div id="mobile-menu" class="mobile-menu">
        <nav aria-label="モバイルナビゲーション">
          <a href="/">TOP</a>
          <a href="/about/">ABOUT</a>
          <a href="/coffee/">COFFEE</a>
          <a href="/contact/" aria-current="page">CONTACT</a>
          <a href="/access/">ACCESS</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="content-page">
      <section id="contact" class="contact--formal tracked-section" aria-labelledby="contact-title">
        <div class="page-shell contact__inner">
          <div class="page-intro">
            <p class="eyebrow">CONTACT</p>
            <h1 id="contact-title">お問い合わせ</h1>
          </div>
          <!-- 公開前にWorker・Siteverify・実メール到達を検証してから送信を有効化する。 -->
          <form id="contact-form" class="contact__form" action="/api/contact" method="post" data-endpoint-ready="false" data-state="initial" aria-describedby="contact-purpose contact-status">
            <p id="contact-status" class="contact__status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">現在、送信機能は準備中です。</p>
            <div class="contact__field">
              <label for="contact-name">お名前 <span>（必須）</span></label>
              <input id="contact-name" name="name" type="text" autocomplete="name" required maxlength="100" aria-describedby="contact-name-error">
              <p id="contact-name-error" class="contact__error" hidden></p>
            </div>
            <div class="contact__field">
              <label for="contact-email">メールアドレス <span>（必須）</span></label>
              <input id="contact-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required maxlength="254" aria-describedby="contact-email-error">
              <p id="contact-email-error" class="contact__error" hidden></p>
            </div>
            <div class="contact__field">
              <label for="contact-message">お問い合わせ内容 <span>（必須）</span></label>
              <textarea id="contact-message" name="message" autocomplete="off" required maxlength="5000" rows="7" aria-describedby="contact-message-error"></textarea>
              <p id="contact-message-error" class="contact__error" hidden></p>
            </div>
            <div id="contact-turnstile" class="contact__turnstile" data-sitekey="" aria-label="送信前の確認"></div>
            <p id="contact-purpose" class="contact__purpose"><span class="copy-phrase">入力いただいた情報は、</span><span class="copy-phrase">お問い合わせへの</span><span class="copy-phrase">回答のために</span><span class="copy-phrase">利用します。</span></p>
            <button id="contact-submit" class="contact__submit" type="submit" disabled>送信する</button>
            <noscript><p class="contact__purpose">送信にはJavaScriptが必要です。</p></noscript>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer site-footer--formal">
      <div class="page-shell footer__inner">
        <div class="footer__identity">
          <img class="footer__logo" src="/images/web/logo-header.png" alt="Bashiiin! coffee" width="400" height="104" loading="lazy" decoding="async">
          <address class="footer__address">京都府京都市下京区市之町239-1<br>やながわビル2F</address>
        </div>
        <nav class="footer__nav" aria-label="フッターナビゲーション">
          <a href="/">TOP</a>
          <a href="/about/">ABOUT</a>
          <a href="/coffee/">COFFEE</a>
          <a href="/contact/" aria-current="page">CONTACT</a>
          <a href="/access/">ACCESS</a>
        </nav>
        <div class="footer__social">
          <a id="footer-instagram-link" class="tracked-link text-link" href="https://www.instagram.com/bashiiin_coffee/" target="_blank" rel="noopener noreferrer" data-event="instagram_click" data-placement="footer-link"><span class="text-link__content"><span class="text-link__label">Instagram</span><svg class="icon icon--arrow-up-right" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></span><span class="sr-only">（@bashiiin_coffee、新しいタブで開きます）</span></a>
        </div>
        <p class="footer__copyright">© <span id="copyright-year">2026</span> Bashiiin! coffee</p>
      </div>
    </footer>
  </body>
</html>
